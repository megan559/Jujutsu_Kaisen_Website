<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Kaisen Website</title>
    <style>
        @font-face{
        font-family: 'JujutsuKaisen';
        src: url('./assets/JujutsuKaisen.ttf') format('truetype');
        }
        body{
            font-family: 'JujutsuKaisen';
            background-color: rgb(54, 70, 104);
            color: rgb(0, 0, 0);
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }
        h1{
            font-family: 'JujutsuKaisen', sans-serif;
            font-size: 55px;
            color: #000000; 
            text-shadow:  
            -2px -2px 0 #f8ed1e,  
            2px -2px 0 #f2f230,  
            -2px  2px 0 #ece939,  
            2px  2px 0 #f4e83f;
        }
        #header{
            width: 100%;
            height: 100px; 
            overflow: hidden;
            border-bottom: 2px solid rgb(0, 0, 0);
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background-color: rgb(0, 0, 0); 
           
        }
        .nav{
            gap: 10px;
        }
        #header a{
            color: rgb(191, 14, 14);
            font-size: 25px;
            text-decoration: none;
            padding: 10px 20px;
        }
        #header a:hover{
            background-color: rgb(249, 236, 91); 
        }
        #content{
            flex-grow: 1; 
            height: calc(100vh - 100px); 
            border: none;
        }
        iframe {
            border: none; 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Jujutsu Kaisen</h1>
        <nav>
            <a href="home.html" target="content">Home</a>
            <a href="characters.html" target="content">Characters</a>
            <a href="episodes.html" target="content">Episodes</a>
            <a href="about.html" target="content">About</a>
            <a href="product.html" target="content">Products</a>
            <a href="register.html" target="content">Register/Login</a>
            <a href="Contact.html" target="content">Contact Us</a>
        </nav>
    </div>
    <iframe id="content" src="home.html" name="content"></iframe>
</body>
</html>
