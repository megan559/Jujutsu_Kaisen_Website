];
		let passwordstring=""
		for(let i=0;i<16;i++){
var x=Math.floor(Math.random() * 4);
if (x==0){passwordstring+=String.fromCharCode(97 + Math.floor(Math.random() * 26));}
else if(x==1){passwordstring+=String.fromCharCode(65 + Math.floor(Math.random() * 26));}
else if (x==2){passwordstring+=Math.floor(Math.random() * 10);}
else {passwordstring+=specialCharacters[Math.floor(Math.random() * 39)];}

}document.getElementById("Password").value=passwordstring;
console.log(passwordstring);}

        if(username){
            usernameMsg.innerHTML="<span class='message'>Validated</span>";
	if(password.length>= 8 && password.length <=16){
            passwordMsg.innerHTML="<span class='message'>Validated</span>";
	    fetch("/website/lr.php", {
