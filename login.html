<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="wrapper">
        <h1>Login</h1>
        <div class="input-box">
            <input type="text" placeholder="Username" id="username" required>
            <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
            <input type="password" placeholder="Password" id="password" required>
            <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="remember-forgot">
            <label><input type="checkbox" id="remember"> Remember me</label>
            <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn" id="sub">Login</button>
        <div class="register-link">
            <p>
                Don't have an account? <a href="register.html">Register</a>
            </p>
        </div>
    </form>
  </div> 
<script>
document.getElementById("sub").addEventListener('click',check);

function check(){
  
uname=document.getElementById("username").value;
fetch("/website/lr.php", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    type: "login",
    uname: document.getElementById("username").value,
    password: document.getElementById("password").value
  })
})
.then(response => response.json())
.then(data => {console.log("Response:", data);


if (data.status === "success") {
    
    sessionStorage.setItem("loggedIn", "true");
    sessionStorage.setItem("username",uname);
    parent.document.getElementById("rl").style.display = 'none';
    parent.document.getElementById("profile_name").innerHTML=uname
    parent.document.getElementById("profile").style.display='inline';
    if (document.getElementById("remember").checked){
	localStorage.setItem("loggedIn","true");
	localStorage.setItem("username",uname);}
    window.location.href = 'home.html';	
		}
else{
sessionStorage.setItem("loggedIn", "false");}}
)
.catch(error => console.error("Error:", error));
}
</script> 
</body>
</html>
