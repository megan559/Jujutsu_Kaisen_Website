<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu Kaisen Website</title>
  <style>
    @font-face {
      font-family: 'JujutsuKaisen';
      src: url('./assets/JujutsuKaisen.ttf') format('truetype');
    }
    body {
      font-family: 'JujutsuKaisen';
      background-color: rgb(54, 70, 104);
      color: black;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    h1 {
      cursor: pointer;
      font-size: 55px;
      color: black;
      text-shadow:
        -2px -2px 0 #f8ed1e,
         2px -2px 0 #f2f230,
        -2px  2px 0 #ece939,
         2px  2px 0 #f4e83f;
    }
    #header {
      width: 100%;
      height: 100px;
      overflow: hidden;
      border-bottom: 2px solid black;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: black;
    }
    #header a {
      color: rgb(191, 14, 14);
      font-size: 25px;
      text-decoration: none;
      padding: 10px 20px;
    }
    #header a:hover {
      background-color: rgb(249, 236, 91);
    }
    #content {
      flex-grow: 1;
      height: calc(100vh - 100px);
      border: none;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }

    .account-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid red;
      background: none;
      padding: 0;
    }

    .account-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
    }

    .profile-card {
      position: absolute;
      top: 40px; /* below the button */
      right: 0;
      width: 200px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 10px;
      display: none;
      z-index: 9999;
    }

    .profile-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 0.9em;
      color: gray;
    }

    .profile-wrapper:hover .profile-card {
      display: block;
    }
    .logout{
	cursor: pointer;
	

}
  </style>
</head>
<body>
  <div id="header">
    <h1 id="title">Jujutsu Kaisen</h1>
    <nav>
      <a href="home.html" target="content">Home</a>
      <a href="characters.html" target="content">Characters</a>
      <a href="episodes.html" target="content">Episodes</a>
      <a href="about.html" target="content">About</a>
      <a href="product.html" target="content">Products</a>
      <a href="register.html" id="rl" target="content">Register/Login</a>
      <a href="Contact.html" target="content">Contact Us</a>
    </nav>
  </div>
  <div class="profile-wrapper" id="profile">
    <button class="account-button" id="accountBtn">
      <img src="https://i.pravatar.cc/300" alt="User PFP" />
    </button>
    <div class="profile-card" id="profileCard">
      <div class="profile-name">John Doe</div>
      <div class="profile-email">john.doe@example.com</div>
      <div class="logout" id="logout">logout</div>	
    </div>
  </div>

  <iframe id="content" src="home.html" name="content"></iframe>

  <script>
    document.getElementById("logout").addEventListener("click",function(){
localStorage.clear();
sessionStorage.clear();
document.getElementById("rl").style.display = "inline"
document.getElementById("profile").style.display = "none"
});
    document.getElementById("title").addEventListener("click", function () {
      location.reload();
    });
    if (localStorage.getItem("loggedIn") !== "true") {
      localStorage.setItem("loggedIn", "false");
    } else {
      sessionStorage.setItem("loggedIn", "true");
      document.getElementById("rl").style.display = "none";
    }

    if (sessionStorage.getItem("loggedIn") !== "true") {
      sessionStorage.setItem("loggedIn", "false");
    } else {
      document.getElementById("rl").style.display = "none";
    }
  </script>
</body>
</html>
